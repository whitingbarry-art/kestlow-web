name: Changeset

on:
  pull_request:

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The check only needs Node and git, not the project's dependencies.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: node scripts/check-changeset.mjs
        env:
          CHANGESET_BASE: origin/${{ github.base_ref }}
