name: Deploy

# Builds the web app and deploys it to Cloudflare Pages on every merge to main (KES-19). The
# build calls the deployed API at the API_URL repository variable (Settings → Secrets and
# variables → Actions → Variables), e.g. https://kestlow-api.<subdomain>.workers.dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the web app
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ vars.API_URL }}
    steps:
      # Without it the deployed site would call /api on itself and find nothing.
      - name: Check the API address is set
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the API_URL repository variable to the deployed API's address."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - run: npm run build

      - name: Create the Pages project if it doesn't exist yet
        run: |
          if ! npx wrangler pages project list | grep -q "kestlow-web"; then
            npx wrangler pages project create kestlow-web --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name kestlow-web --branch main
