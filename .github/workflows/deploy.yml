name: Deploy

# Builds the web app and deploys it to Cloudflare Pages on every merge to main (KES-19). The
# deployed site calls the API at its own /api, which a Pages Function passes to the kestlow-api
# Worker (apps/web/functions and wrangler.toml), so the session cookie stays first-party.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy the web app
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - run: npm run build

      - name: Create the Pages project if it doesn't exist yet
        run: |
          if ! npx wrangler pages project list | grep -q "kestlow-web"; then
            npx wrangler pages project create kestlow-web --production-branch main
          fi

      # From apps/web, so wrangler picks up wrangler.toml and the functions directory too.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        run: npx wrangler pages deploy --project-name kestlow-web --branch main
