<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Kestlow: planning leads for tradespeople</title>
    <!-- The same launch page as kestlow.co.uk/, so search engines list that address instead.
         What search results and link previews show before the page's script runs (KES-135). -->
    <meta
      name="description"
      content="Planning leads for roofers, electricians, landscapers and groundworkers in south-east London, Kent and Surrey, sent to your phone. Try Pro free for 14 days."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kestlow" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Kestlow: planning leads for tradespeople" />
    <meta
      property="og:description"
      content="Planning leads for roofers, electricians, landscapers and groundworkers in south-east London, Kent and Surrey, sent to your phone. Try Pro free for 14 days."
    />
    <meta property="og:url" content="https://kestlow.co.uk/" />
    <meta property="og:image" content="https://kestlow.co.uk/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://kestlow.co.uk/" />
    <script>
      // Follow the device's theme before React mounts, so dark-mode users don't see a light flash.
      if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/waitlist.tsx"></script>
  </body>
</html>
