<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- So Kestlow can go on a Home Screen and open like an app; iPhones only allow push then (KES-118). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#12304a" />
    <meta name="apple-mobile-web-app-title" content="Kestlow" />
    <title>Kestlow</title>
    <script>
      // Match useTheme's starting theme before React mounts, so dark-mode users don't see a light flash.
      if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
